name: Install Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n tests/install_test.sh

      - name: Run install regression tests
        run: tests/install_test.sh
